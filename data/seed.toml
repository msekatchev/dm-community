[[experiment]]
key = "DMRadio"
long_name = "DMRadio: lumped-element search for low-mass axions"
url = "https://dmradio.stanford.edu"
description = "Program of lumped-element (LC resonator) searches for axion and hidden-photon dark matter below about 1 µeV, run by a Stanford, SLAC, Berkeley, MIT, UNC and Princeton collaboration. Stages include DMRadio-50L and DMRadio-m³."

[[experiment]]
key = "GBT Dark Matter"
long_name = "Green Bank Telescope dark matter searches"
url = "https://axions.berkeley.edu"
description = "Searches for radio signals from axion dark matter (e.g. axion–photon conversion near neutron stars) in archival Green Bank Telescope data."

