# Hand-curated seed for the dm-community graph.
#
# Each [[person]] becomes a note in People/. Everything else (career, experiments,
# institutions, coauthors, papers) is pulled from INSPIRE-HEP by scripts/fetch.py
# and written by scripts/build.py.
#
# inspire: list of INSPIRE author record IDs belonging to this person. People often
#   have several (duplicate stubs), so all listed records are merged.
#   filter = "all"   -> trust every paper on that record
#   filter = "group" -> record is shared with other people of the same name; keep only
#                       papers coauthored with someone else in this seed file
#   filter = "berkeley" -> like "group", and the person must also be listed with a
#                       UC Berkeley affiliation on that paper
# group / group_role: membership in a research group defined under [[group]].
# destination: where they went after the group, with a source.
# positions: manual career entries that override INSPIRE (use when INSPIRE is stale).

# Collaboration names on papers that are working groups or reviews, not experiments.
ignore_collaborations = ["Working Group", "Study Group", "Design Group", "Particle Data Group",
  "Organization", "Aachen-Bonn-CERN-London-Oxford-Saclay"]

[[group]]
key = "vanbibber"
name = "Van Bibber Group"
long_name = "Berkeley Axion Works (van Bibber group)"
pi = "karl-van-bibber"
institution = 903299
url = "https://axions.berkeley.edu"
description = "Axion dark matter group in the Department of Nuclear Engineering at UC Berkeley, led by Karl van Bibber. Designs and builds microwave cavities and resonators for haloscope searches (HAYSTAC, ALPHA, DMRadio), mines Green Bank Telescope data, and develops gamma-ray instrumentation (GALAXIS)."
